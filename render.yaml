# Render Blueprint — one web service that runs the Flask API AND serves the
# website, so the whole project lives at a single URL.
#   1. Push this repo to GitHub.
#   2. Render dashboard -> New -> Blueprint -> pick the repo.
#   3. When prompted, paste DATABASE_URL (Neon Postgres) and MONGO_URI (Atlas).
# TOKEN_SECRET is generated for you.
services:
  - type: web
    name: resalewise-sg
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker + threads: the rate limiter and caches live in process memory,
    # so a single process keeps their counts accurate.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /api/ping
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false          # you enter this in the dashboard
      - key: MONGO_URI
        sync: false          # you enter this in the dashboard
      - key: TOKEN_SECRET
        generateValue: true  # random signing key for login tokens
      - key: TRUST_PROXY
        value: "1"           # real client IPs for rate limiting behind Render's proxy
